name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Core has no provider names
        run: |
          if grep -rniE "razorpay|stripe|paypal|cashfree|juspay|rzp_" src/payguard/core; then
            echo "::error::provider names found in src/payguard/core"; exit 1
          fi
      - name: Tests
        run: uv run pytest -q

  # Known-vulnerable or known-malicious versions in either lock file fail the build.
  dependencies:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=uv.lock
        --lockfile=web/package-lock.json
