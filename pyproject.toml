[project]
name = "payguard"
version = "0.1.0"
description = "A safety layer for AI agents that move money: judges what each payment tool call does before it reaches the provider."
readme = "README.md"
authors = [
    { name = "ASHinarretable", email = "aishwaryapawar3082002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.40.0",
    "httpx>=0.28.1",
    "litellm>=1.103.2",
    "mcp>=2.2.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
]

[project.scripts]
payguard = "payguard:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
