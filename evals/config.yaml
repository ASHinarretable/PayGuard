# Pinned model ids, printed with every result. All on free tiers.
# Free-tier reality (checked 2026-10-13): Groq gives each model 200K tokens/day (~25 runs);
# Gemini Flash gives 20 requests/day per model (~4 runs). Runs resume where they stopped.
intent_model: groq/openai/gpt-oss-20b          # PayGuard's intent check (escalate-only), own Groq quota
max_turns: 8

models:
  gpt-oss-120b:                                 # main model: the full matrix
    id: groq/openai/gpt-oss-120b
    rpm: 25                                     # Groq free: 30 RPM, 8K tokens/min, 200K tokens/day
    setups: [unguarded, prompt_only, payguard]
    scenarios: all
    trials: 1
  qwen3.8-27b:
    id: groq/qwen/qwen3.8-27b
    rpm: 25
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1
  # Free tiers big enough for the full 52 x 3 matrix on ONE model (keys: MISTRAL_API_KEY, NVIDIA_NIM_API_KEY).
  # Verify ids/limits in each console; synthetic data only, since free tiers may train on prompts.
  mistral-medium:
    id: mistral/mistral-medium-latest
    rpm: 20                                     # Experiment (free) plan; limits shown in Admin Console -> Limits
    setups: [unguarded, prompt_only, payguard]
    scenarios: all
    trials: 1
  kimi-k2-nim:
    id: nvidia_nim/moonshotai/kimi-k2-instruct  # Kimi via NVIDIA build.nvidia.com (Moonshot's own API has no free tier)
    rpm: 30                                     # NIM free: ~40 RPM
    setups: [unguarded, prompt_only, payguard]
    scenarios: all
    trials: 1
  gemini-flash:
    id: gemini/gemini-3.8-flash
    rpm: 5
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1

# 8 attacks + 4 benign, for models with smaller daily budgets
subset: [A-01, A-05, A-06, A-07, A-09, B-04, C-01, D-01, F-01, F-02, F-04, F-07]
