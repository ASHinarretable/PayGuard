# Pinned model ids, printed with every result. All on free tiers.
# Free-tier reality (checked 2026-10-13): Groq gives each model 200K tokens/day (~25 runs);
# Gemini Flash gives 20 requests/day per model (~4 runs). Runs resume where they stopped.
intent_model: groq/openai/gpt-oss-20b          # PayGuard's intent check (escalate-only), own Groq quota
max_turns: 8

models:
  gpt-oss-120b:                                 # out-of-sample check: a different vendor, never tuned on
    id: groq/openai/gpt-oss-120b
    rpm: 25                                     # Groq free: 30 RPM, 8K tokens/min, 200K tokens/day (~14 runs)
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1
  qwen3.8-27b:
    id: groq/qwen/qwen3.8-27b
    rpm: 25
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1
  # Free tiers big enough for the full 52 x 3 matrix on ONE model (keys: MISTRAL_API_KEY, NVIDIA_NIM_API_KEY).
  # Verify ids/limits in each console; synthetic data only, since free tiers may train on prompts.
  ministral-8b:                                 # a second Mistral model, free and fast: the full matrix
    id: mistral/ministral-8b-2512
    rpm: 60                                     # free plan reports 188 req/min for this model
    setups: [unguarded, prompt_only, tool_allowlist, spend_caps, payguard]
    scenarios: all
    trials: 1
  ministral-14b:                                # full matrix on Mistral's free Experiment plan
    id: mistral/ministral-14b-2512              # Medium/Small/Large are not enabled on the free plan (checked 2026-10-13)
    rpm: 25                                     # free plan reports 30 req/min, 937K tokens/min for this model
    setups: [unguarded, prompt_only, tool_allowlist, spend_caps, payguard]
    scenarios: all
    trials: 1
  kimi-k2-nim:
    id: nvidia_nim/moonshotai/kimi-k2-instruct  # Kimi via NVIDIA build.nvidia.com (Moonshot's own API has no free tier)
    rpm: 30                                     # NIM free: ~40 RPM
    setups: [unguarded, prompt_only, payguard]
    scenarios: all
    trials: 1
  # OpenRouter free models: 50 requests/day without credits, so a subset run takes a few days.
  nemotron-super:
    id: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    rpm: 15
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1
  gemma-4-31b:
    id: openrouter/google/gemma-4-31b-it:free
    rpm: 15
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1
  # Cloudflare Workers AI: 10,000 neurons/day free (keys: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
  llama-4-scout:
    id: cloudflare/@cf/meta/llama-4-scout-17b-16e-instruct
    rpm: 30
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1
  gemini-flash:
    id: gemini/gemini-3.8-flash
    rpm: 5
    setups: [unguarded, payguard]
    scenarios: subset
    trials: 1

# 10 attacks + 5 benign (3 of them India-first), for models with small daily budgets
subset: [A-01, A-05, A-06, A-07, A-09, B-04, C-01, D-01, I-01, I-07, F-01, F-02, F-04, F-07, I-12]
